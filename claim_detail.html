​<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claim Details - Golden Bear Insurance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #fafbfc;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, #b8860b 0%, #daa520 100%);
            color: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-logo-title {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-logo {
            height: 50px;
            width: auto;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.3));
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .back-btn:hover {
            background: white;
            color: #b8860b;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .loading-spinner {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #b8860b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid #e8ecef;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px solid #f5f6f7;
        }

        .card-title {
            font-size: 22px;
            font-weight: 600;
            color: #1a1f36;
            letter-spacing: -0.3px;
        }

        .section-header {
            font-size: 14px;
            font-weight: 600;
            color: #b8860b;
            margin-bottom: 16px;
            margin-top: 24px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f5f6f7;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-approved {
            background: #c6f6d5;
            color: #22543d;
        }

        .status-pending,
        .status-submitted {
            background: #fef3c7;
            color: #78350f;
        }

        .status-rejected {
            background: #fed7d7;
            color: #742a2a;
        }

        .status-in-review {
            background: #e6f3ff;
            color: #0066cc;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 16px 20px;
        }

        .info-item {
            margin-bottom: 0;
            padding-bottom: 12px;
            border-bottom: 1px solid #f1f3f5;
        }

        .info-item:hover {
            border-bottom-color: #daa520;
        }

        .info-label {
            font-size: 11px;
            font-weight: 600;
            color: #8b92a0;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 6px;
        }

        .info-value {
            font-size: 16px;
            color: #1a1f36;
            font-weight: 500;
            line-height: 1.5;
        }

        .info-value.empty {
            color: #a0aec0;
            font-style: italic;
        }

        .section-divider {
            border-top: 2px solid #f1f3f5;
            margin: 28px 0 0 0;
        }

        .description-box {
            background: #fafbfc;
            border: 1px solid #e8ecef;
            border-left: 3px solid #b8860b;
            padding: 16px;
            border-radius: 8px;
            margin-top: 16px;
        }

        .description-box h4 {
            font-size: 13px;
            font-weight: 600;
            color: #1a1f36;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .description-box p {
            font-size: 15px;
            color: #4a5568;
            line-height: 1.7;
        }

        .boolean-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .boolean-true {
            background: #c6f6d5;
            color: #22543d;
        }

        .boolean-false {
            background: #fed7d7;
            color: #742a2a;
        }

        .error-message {
            background: #fed7d7;
            border-left: 4px solid #c53030;
            color: #742a2a;
            padding: 20px;
            border-radius: 4px;
            margin: 20px 0;
        }

        .no-policy {
            background: #fef3c7;
            border-left: 4px solid #d69e2e;
            color: #78350f;
            padding: 20px;
            border-radius: 4px;
            margin: 20px 0;
        }

        .claim-status-highlight {
            background: #fffbf5;
            border-left: 3px solid #daa520;
            border-radius: 4px;
            padding: 12px 16px;
        }

        .claim-status-highlight .info-label {
            color: #b8860b;
            font-weight: 600;
        }

        .claim-status-highlight .info-value {
            color: #1a1f36;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .info-grid {
                grid-template-columns: 1fr;
            }

            .header-content {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }
        }

        .doc-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 12px;
        }

        .doc-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            background: #fff;
            border: 1px solid #dde3ec;
            border-radius: 8px;
            transition: background 0.15s;
        }

        .doc-row:hover {
            background: #f0f5ff;
        }

        .doc-icon {
            font-size: 22px;
            flex-shrink: 0;
        }

        .doc-info {
            flex: 1;
            min-width: 0;
        }

        .doc-name {
            font-weight: 600;
            color: #1a1a2e;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .doc-meta {
            font-size: 12px;
            color: #6b7280;
            margin-top: 2px;
        }

        .doc-open-btn {
            flex-shrink: 0;
            display: inline-block;
            background: #0066cc;
            color: #fff;
            padding: 6px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .doc-open-btn:hover {
            background: #0052a3;
        }

        .doc-loading {
            color: #6b7280;
            font-style: italic;
            padding: 8px 0;
        }

        /* --- Document table --- */
        .docs-table {
            width: 100%;
            border-collapse: collapse;
        }

        .docs-table th {
            text-align: left;
            font-size: 11px;
            font-weight: 600;
            color: #8b92a0;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding: 10px 14px;
            border-bottom: 2px solid #f1f3f5;
        }

        .docs-table td {
            padding: 12px 14px;
            border-bottom: 1px solid #f1f3f5;
            font-size: 14px;
            color: #1a1f36;
            vertical-align: middle;
        }

        .docs-table tr:last-child td { border-bottom: none; }
        .docs-table tr:hover td { background: #fafbfc; }

        .doc-name-link {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #1a1f36;
            text-decoration: none;
            font-weight: 500;
        }

        .doc-name-link:hover { color: #0066cc; }

        .doc-icon-pdf  { background: #fde8e8; color: #e53e3e; width: 34px; height: 34px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
        .doc-icon-html { background: #fef3c7; color: #d69e2e; width: 34px; height: 34px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
        .doc-icon-json { background: #e6f3ff; color: #0066cc; width: 34px; height: 34px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
        .doc-icon-eml  { background: #f0e6ff; color: #7c3aed; width: 34px; height: 34px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
        .doc-icon-def  { background: #f1f3f5; color: #6b7280; width: 34px; height: 34px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }

        .doc-type-badge {
            display: inline-block;
            padding: 3px 9px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            background: #f1f3f5;
            color: #4a5568;
            letter-spacing: 0.5px;
        }

    </style>
</head>

<body>
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner">
            <div class="spinner"></div>
            <div>Loading claim details...</div>
        </div>
    </div>

    <div class="container">
        <div class="header">
            <div class="header-content">
                <div class="header-logo-title">
                    <img src="/logo-cropped.svg" alt="Golden Bear Insurance" class="header-logo">
                    <h1>Claim Details</h1>
                </div>
                <a href="/claims" class="back-btn">← Back to Claims</a>
            </div>
        </div>

        <div id="content">
            <!-- Content will be loaded here -->
        </div>
    </div>

    <script>
        const API_BASE_URL = window.location.origin;

        // Get claim ID from URL
        function getClaimIdFromUrl() {
            const pathParts = window.location.pathname.split('/');
            return pathParts[pathParts.length - 1];
        }

        // Load claim details on page load
        document.addEventListener('DOMContentLoaded', loadClaimDetails);

        async function loadClaimDetails() {
            const claimId = getClaimIdFromUrl();
            const loadingOverlay = document.getElementById('loadingOverlay');
            const content = document.getElementById('content');

            try {
                const response = await fetch(`${API_BASE_URL}/api/claims/${claimId}`);
                const data = await response.json();

                loadingOverlay.style.display = 'none';

                if (data.success) {
                    renderClaimDetails(data.claim, data.policy);
                    loadClaimsFolder(claimId, data.claim.folder_url);
                } else {
                    content.innerHTML = `
                        <div class="error-message">
                            <strong>Error:</strong> ${data.error || 'Failed to load claim details'}
                        </div>
                    `;
                }
            } catch (error) {
                loadingOverlay.style.display = 'none';
                console.error('Error fetching claim details:', error);
                content.innerHTML = `
                    <div class="error-message">
                        <strong>Error:</strong> Failed to load claim details. Make sure the server is running.
                    </div>
                `;
            }
        }

        async function loadClaimsFolder(claimId, folderUrl) {
            const section = document.getElementById('claims-folder-section');
            const headerActions = document.getElementById('claims-folder-header-actions');
            if (!section) return;

            if (folderUrl && headerActions) {
                headerActions.innerHTML = `
                    <a class="doc-open-btn" href="${folderUrl}" target="_blank" style="padding:7px 16px;font-size:13px;">
                        🔗 Open Folder
                    </a>`;
            }

            try {
                const res = await fetch(`${API_BASE_URL}/api/claims/${claimId}/documents`);
                const data = await res.json();

                if (!data.success || !data.documents || data.documents.length === 0) {
                    section.innerHTML = '<p class="doc-empty" style="padding:20px 0;color:#a0aec0;font-style:italic;">No documents found in this claims folder.</p>';
                    return;
                }

                const docs = data.documents;
                const titleEl = document.querySelector('#claims-folder-card .card-title');
                if (titleEl) titleEl.innerHTML = `📁 Claims Folder &nbsp;<span class="status-badge" style="background:#e6f3ff;color:#0066cc;font-size:12px;">${docs.length} file${docs.length !== 1 ? 's' : ''}</span>`;

                section.innerHTML = `
                    <table class="docs-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Type</th>
                                <th>Uploaded</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
                            ${docs.map(doc => {
                                const ext = doc.name.split('.').pop().toLowerCase();
                                const iconClass = ext === 'pdf'  ? 'doc-icon-pdf'
                                               : ext === 'json' ? 'doc-icon-json'
                                               : ext === 'html' ? 'doc-icon-html'
                                               : ext === 'eml'  ? 'doc-icon-eml'
                                               : 'doc-icon-def';
                                const icon = ext === 'pdf'  ? '📄'
                                           : ext === 'json' ? '📋'
                                           : ext === 'html' ? '🌐'
                                           : ext === 'eml'  ? '✉️'
                                           : '📎';
                                const uploaded = doc.modified
                                    ? new Date(doc.modified).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' })
                                    : '—';
                                return `<tr>
                                    <td>
                                        <a class="doc-name-link" href="${doc.web_url || '#'}" target="_blank">
                                            <span class="doc-icon ${iconClass}">${icon}</span>
                                            ${doc.name}
                                        </a>
                                    </td>
                                    <td><span class="doc-type-badge">${ext}</span></td>
                                    <td style="color:#6b7280;font-size:13px;">${uploaded}</td>
                                    <td>${doc.web_url ? `<a class="doc-open-btn" href="${doc.web_url}" target="_blank" style="padding:5px 12px;font-size:12px;">Download</a>` : ''}</td>
                                </tr>`;
                            }).join('')}
                        </tbody>
                    </table>`;
            } catch (err) {
                if (section) section.innerHTML = '<p class="doc-empty" style="padding:20px 0;color:#a0aec0;">Could not load documents.</p>';
            }
        }

        function renderClaimDetails(claim, policy) {
            const content = document.getElementById('content');

            const claimHtml = `
                <!-- Claim Information Card -->
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">Claim Information</h2>
                        <span class="status-badge ${getStatusClass(claim.claim_status)}">
                            ${claim.claim_status || 'Pending'}
                        </span>
                    </div>

                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-label">Claim ID</div>
                            <div class="info-value">${claim.claim_id || '—'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Policy ID</div>
                            <div class="info-value">${claim.policy_id || '—'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Claim Type</div>
                            <div class="info-value">${claim.claim_type || '—'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Date of Loss</div>
                            <div class="info-value">${formatDate(claim.date_of_loss) || '—'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Claim Submitted</div>
                            <div class="info-value">${formatDateTime(claim.claim_submitted_at) || '—'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Record Updated</div>
                            <div class="info-value">${formatDateTime(claim.created_at) || '—'}</div>
                        </div>
                    </div>

                    ${claim.claim_description ? `
                        <div class="description-box">
                            <h4>Claim Description</h4>
                            <p>${claim.claim_description}</p>
                        </div>
                    ` : ''}
                </div>

                <!-- Claims Folder Documents Card -->
                <div class="card" id="claims-folder-card">
                    <div class="card-header">
                        <h2 class="card-title">📁 Claims Folder</h2>
                        <div id="claims-folder-header-actions"></div>
                    </div>
                    <div id="claims-folder-section">
                        <p class="doc-loading" style="padding:16px 0;color:#8b92a0;">Loading documents…</p>
                    </div>
                </div>

                <!-- Reporting Party Card -->
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">Reporting Party</h2>
                    </div>

                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-label">First Name</div>
                            <div class="info-value ${!claim.reporting_first_name ? 'empty' : ''}">${claim.reporting_first_name || 'Not provided'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Last Name</div>
                            <div class="info-value ${!claim.reporting_last_name ? 'empty' : ''}">${claim.reporting_last_name || 'Not provided'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Email</div>
                            <div class="info-value ${!claim.reporting_email ? 'empty' : ''}">${claim.reporting_email || 'Not provided'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Phone</div>
                            <div class="info-value ${!claim.reporting_phone ? 'empty' : ''}">${claim.reporting_phone || 'Not provided'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Address</div>
                            <div class="info-value ${!claim.reporting_address ? 'empty' : ''}">${claim.reporting_address || 'Not provided'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">City</div>
                            <div class="info-value ${!claim.reporting_city ? 'empty' : ''}">${claim.reporting_city || 'Not provided'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">State</div>
                            <div class="info-value ${!claim.reporting_state ? 'empty' : ''}">${claim.reporting_state || 'Not provided'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">ZIP Code</div>
                            <div class="info-value ${!claim.reporting_zip ? 'empty' : ''}">${claim.reporting_zip || 'Not provided'}</div>
                        </div>
                    </div>
                </div>

                <!-- Insured Party Card -->
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">Insured Party</h2>
                        <span class="boolean-badge ${claim.insured_same_as_reporter ? 'boolean-true' : 'boolean-false'}">
                            ${claim.insured_same_as_reporter ? 'Same as Reporter' : 'Different from Reporter'}
                        </span>
                    </div>

                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-label">First Name</div>
                            <div class="info-value ${!claim.insured_first_name ? 'empty' : ''}">${claim.insured_first_name || 'Not provided'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Last Name</div>
                            <div class="info-value ${!claim.insured_last_name ? 'empty' : ''}">${claim.insured_last_name || 'Not provided'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Email</div>
                            <div class="info-value ${!claim.insured_email ? 'empty' : ''}">${claim.insured_email || 'Not provided'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Phone</div>
                            <div class="info-value ${!claim.insured_phone ? 'empty' : ''}">${claim.insured_phone || 'Not provided'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Address</div>
                            <div class="info-value ${!claim.insured_address ? 'empty' : ''}">${claim.insured_address || 'Not provided'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">City</div>
                            <div class="info-value ${!claim.insured_city ? 'empty' : ''}">${claim.insured_city || 'Not provided'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">State</div>
                            <div class="info-value ${!claim.insured_state ? 'empty' : ''}">${claim.insured_state || 'Not provided'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">ZIP Code</div>
                            <div class="info-value ${!claim.insured_zip ? 'empty' : ''}">${claim.insured_zip || 'Not provided'}</div>
                        </div>
                    </div>
                </div>

                <!-- Incident Details Card -->
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">Incident Details</h2>
                    </div>

                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-label">Injuries Reported</div>
                            <div class="info-value">
                                <span class="boolean-badge ${claim.injuries_reported ? 'boolean-true' : 'boolean-false'}">
                                    ${claim.injuries_reported ? 'Yes' : 'No'}
                                </span>
                            </div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Witness Present</div>
                            <div class="info-value">
                                <span class="boolean-badge ${claim.witness_present ? 'boolean-true' : 'boolean-false'}">
                                    ${claim.witness_present ? 'Yes' : 'No'}
                                </span>
                            </div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Police Report Filed</div>
                            <div class="info-value">
                                <span class="boolean-badge ${claim.police_report_filed ? 'boolean-true' : 'boolean-false'}">
                                    ${claim.police_report_filed ? 'Yes' : 'No'}
                                </span>
                            </div>
                        </div>
                    </div>

                    ${claim.witness_present ? `
                        <div class="section-divider"></div>
                        <h3 class="section-header">Witness Information</h3>
                        <div class="info-grid">
                            <div class="info-item">
                                <div class="info-label">Witness First Name</div>
                                <div class="info-value ${!claim.witness_first_name ? 'empty' : ''}">${claim.witness_first_name || 'Not provided'}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">Witness Last Name</div>
                                <div class="info-value ${!claim.witness_last_name ? 'empty' : ''}">${claim.witness_last_name || 'Not provided'}</div>
                            </div>
                        </div>
                    ` : ''}
                </div>

                ${policy ? renderPolicyCard(policy) : `
                    <div class="no-policy">
                        <strong>Note:</strong> No policy information found for Policy ID: ${claim.policy_id}
                    </div>
                `}
            `;

            content.innerHTML = claimHtml;
        }

        function renderPolicyCard(policy) {
            return `
                <!-- Policy Information Card -->
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">Associated Policy Information</h2>
                    </div>

                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-label">Policy ID</div>
                            <div class="info-value">${policy.policy_id || '—'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Policy Name</div>
                            <div class="info-value">${policy.policy_name || '—'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Policy Type</div>
                            <div class="info-value">${policy.policy_type || '—'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Policy Status</div>
                            <div class="info-value">${policy.policy_status || '—'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Beneficiary</div>
                            <div class="info-value ${!policy.policy_beneficiary ? 'empty' : ''}">${policy.policy_beneficiary || 'Not provided'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Insured Entity Type</div>
                            <div class="info-value">${policy.insured_entity_type || '—'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Property Type</div>
                            <div class="info-value">${policy.property_type || '—'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Coverage Type</div>
                            <div class="info-value">${policy.coverage_type || '—'}</div>
                        </div>
                        <div class="info-item claim-status-highlight">
                            <div class="info-label">Claim Status</div>
                            <div class="info-value">${policy.claim_status || '—'}</div>
                        </div>
                    </div>

                    <div class="section-divider"></div>
                    <h3 class="section-header">Policy Dates</h3>
                    
                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-label">Start Date</div>
                            <div class="info-value">${formatDate(policy.policy_start_date) || '—'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">End Date</div>
                            <div class="info-value">${formatDate(policy.policy_end_date) || '—'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Issue Date</div>
                            <div class="info-value">${formatDate(policy.policy_issue_date) || '—'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Duration (Years)</div>
                            <div class="info-value">${policy.policy_duration_years || '—'}</div>
                        </div>
                    </div>

                    <div class="section-divider"></div>
                    <h3 class="section-header">Financial Details</h3>
                    
                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-label">Sum Insured</div>
                            <div class="info-value">${formatCurrency(policy.sum_insured, policy.currency)}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Premium Amount</div>
                            <div class="info-value">${formatCurrency(policy.premium_amount, policy.currency)}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Deductible Amount</div>
                            <div class="info-value">${formatCurrency(policy.deductible_amount, policy.currency)}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Currency</div>
                            <div class="info-value">${policy.currency || '—'}</div>
                        </div>
                    </div>

                    <div class="section-divider"></div>
                    <h3 class="section-header">Stakeholders</h3>
                    
                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-label">Agent Name</div>
                            <div class="info-value ${!policy.agent_name ? 'empty' : ''}">${policy.agent_name || 'Not provided'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Broker Name</div>
                            <div class="info-value ${!policy.broker_name ? 'empty' : ''}">${policy.broker_name || 'Not provided'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Underwriter Name</div>
                            <div class="info-value ${!policy.underwriter_name ? 'empty' : ''}">${policy.underwriter_name || 'Not provided'}</div>
                        </div>
                    </div>

                    <div class="section-divider"></div>
                    <h3 class="section-header">Locations</h3>
                    
                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-label">Insured Address</div>
                            <div class="info-value ${!policy.insured_address ? 'empty' : ''}">${policy.insured_address || 'Not provided'}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Risk Location</div>
                            <div class="info-value ${!policy.risk_location ? 'empty' : ''}">${policy.risk_location || 'Not provided'}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function getStatusClass(status) {
            const s = (status || '').toLowerCase().replace(/\s+/g, '-');
            if (s.includes('approve')) return 'status-approved';
            if (s.includes('reject') || s.includes('deny')) return 'status-rejected';
            if (s.includes('review')) return 'status-in-review';
            if (s.includes('submit')) return 'status-submitted';
            return 'status-pending';
        }

        function formatDate(dateStr) {
            if (!dateStr) return null;
            try {
                const date = new Date(dateStr);
                return date.toLocaleDateString('en-US', { 
                    year: 'numeric', 
                    month: 'long', 
                    day: 'numeric' 
                });
            } catch {
                return dateStr;
            }
        }

        function formatDateTime(dateStr) {
            if (!dateStr) return null;
            try {
                const date = new Date(dateStr);
                return date.toLocaleDateString('en-US', { 
                    year: 'numeric', 
                    month: 'long', 
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            } catch {
                return dateStr;
            }
        }

        function formatCurrency(amount, currency = 'USD') {
            if (!amount) return '—';
            try {
                return new Intl.NumberFormat('en-US', {
                    style: 'currency',
                    currency: currency || 'USD'
                }).format(amount);
            } catch {
                return `${currency} ${amount}`;
            }
        }
    </script>
</body>

</html>
